<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zenmart</title>
  </head>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../Zenmart/public/css/command.css" />
  <link rel="stylesheet" href="../Zenmart/public/css/home.css" />

  <body>
    <div class="navbar-frame">
      <div class="container">
        <div class="navbar-top">
          <a href="../Zenmart/index.html">
            <img
              src="../Zenmart/public/images/icons/logo.png"
              alt="Zenmart Logo"
            />
          </a>

          <div class="navbar-search">
            <div class="search-box">
              <div class="category-list">
                <select name="category" id="category">
                  <option value="all">All Categories</option>
                  <option value="electronics">Electronics</option>
                  <option value="clothing">Computer</option>
                </select>
              </div>

              <input type="text" placeholder="Search products" />
            </div>
            <div class="search-icon-box">
              <img src="./public/images/icons/search.svg" />
            </div>
          </div>
          <div class="nav-top-menu">
            <div class="menu-box">
                <div class="menu-icon">
                    <img src="./public/images/icons/heart.svg" />
                </div>
           </div>
            <div class="menu-text">
                    <span>Wishlist</span>
                    <strong>My Items</strong>
            </div>
                        <div class="menu-box">
                <div class="menu-icon">
                    <img src="./public/images/icons/profile.svg" />
                </div>
                            </div>
            <div class="menu-text">
                    <span>Sign in</span>
                    <strong>Account</strong>
                </div>
                            <div class="menu-box">
                <div class="menu-icon">
                  <div class="basket">2</div>
                    <img src="./public/images/icons/shopping-cart.svg" />
                </div>
                
            </div>
            <div class="menu-text">
                    <span>$200.99</span>
                    <strong>Total</strong>
                </div>
          </div>
        </div>
        <div class="navbar-bott">
           <div class="twicebox">
            <div class="browse-box">
              <img src="../Zenmart/public/images/icons/browse.svg"/>
              <span>Browse Categories</span>
            </div>
          </div>
           <div class="navbar-route-menu">
            <a href="" class="title">Home</a>
            <a href="">Shop</a>
            <a href="">Orders</a>
            <a href="">About</a>
            <a href="">Contact</a>
            
          </div>
          <div class="third">
            <span>Deal of the Day</span>
            <span>Hot Deals</span>
            <span>Best Sellers</span>
            <span>New Arriwals</span>
          </div>
        </div>
                  
               
        
        
      </div>
    </div>
  </body>
</html>
